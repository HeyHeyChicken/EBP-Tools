permissions:
    contents: write

name: Build Windows, macOS and Linux binaries

# The CICD will be launched for each tag created.
on:
    push:
        tags:
            - '*'

jobs:
    # Run Jest tests.
    test:
        runs-on: ubuntu-latest
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4
            # Verify that the tag matches the version in package.json.
            - name: Verify tag matches package.json version
              run: |
                  PKG_VERSION=$(node -p "require('./package.json').version")
                  if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
                    echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'."
                    exit 1
                  fi
            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm
            # Validate translation files.
            - name: Validate translations
              run: node scripts/validate-translations.js
            # Run Jest tests.
            - name: Run tests
              run: npm test

    # Create the MacOS ARM64 (Apple Silicon) version of the application.
    build-macos-arm64:
        runs-on: macos-latest
        needs: [test]
        env:
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4

            # Import Apple certificate
            - name: Import Code-Signing Certificates
              uses: Apple-Actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
                  p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm

            # Cache Homebrew packages to avoid reinstalling on every run.
            - name: Cache Homebrew packages
              uses: actions/cache@v4
              with:
                  path: ~/Library/Caches/Homebrew
                  key: homebrew-tesseract-${{ runner.os }}-arm64

            # Install Tesseract and build the Python analyzer binary.
            - name: Install Tesseract
              # pkg-config lets tesserocr's source build find leptonica by its
              # real name (-lleptonica). Without it the link fails with
              # "library 'lept' not found" (legacy hardcoded fallback).
              run: brew install tesseract pkg-config

            - name: Build Python analyzer binary
              run: cd python && bash build.sh

            # Fail the build if the packaged binary doesn't actually use tesserocr
            # (a bundling gap can silently fall back to slow pytesseract). Runs the
            # unsigned binary locally; exits 0 only when in-process tesserocr inits.
            - name: Verify packaged binary uses tesserocr (in-process OCR)
              run: |
                  binaries/analyzer/darwin/darwin selftest || {
                    echo "::error::Packaged darwin binary is NOT using tesserocr — OCR would fall back to pytesseract"
                    exit 1
                  }

            # Sign all files in the onedir bundle before Electron Forge packages them.
            # With --onedir, Python.framework and dylibs are present at build time and
            # can be individually signed — unlike --onefile which extracts to /tmp at
            # runtime (where files cannot be pre-signed, causing Team ID mismatch errors).
            # Sign inside-out: dylibs first, then the main executable.
            - name: Sign Python analyzer binary
              run: |
                  find binaries/analyzer/darwin -type f \( -name "*.dylib" -o -name "*.so" \) | while read f; do
                    codesign --force \
                      --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                      --options runtime \
                      --entitlements build/entitlements.plist \
                      --timestamp \
                      "$f"
                  done
                  codesign --force \
                    --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                    --options runtime \
                    --entitlements build/entitlements.plist \
                    --timestamp \
                    binaries/analyzer/darwin/_internal/tesseract/tesseract
                  codesign --force \
                    --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                    --options runtime \
                    --entitlements build/entitlements.plist \
                    --timestamp \
                    binaries/analyzer/darwin/darwin

            # Building Angular and making the Electron application.
            - name: Build Electron app
              run: npm run make

            # Rename the created binary.
            - name: Rename .dmg
              run: |
                  file=$(find out/make -type f -name "*.dmg" | head -n 1)
                  mv "$file" out/make/EBP-Tools-${GITHUB_REF_NAME}-arm64.dmg

            # Generate update metadata files
            - name: Generate update metadata
              run: node scripts/generate-update-metadata.js ${GITHUB_REF_NAME} darwin arm64

            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macos-arm64
                  path: |
                      out/make/*.dmg
                      out/make/*.zip
                      out/make/latest-mac.yml

    # Create the MacOS x64 (Intel) version of the application.
    # Runs on a self-hosted Intel Mac runner since GitHub no longer offers
    # hosted Intel macOS runners on recent images.
    build-macos-intel:
        runs-on: self-hosted
        needs: [test]
        env:
            APPLE_ID: ${{ secrets.APPLE_ID }}
            APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
            APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4

            # Self-hosted runners persist state between runs. The
            # import-codesign-certs action creates a `signing_temp.keychain`
            # every run and fails if one already exists from a previous build,
            # so we clear any leftover keychain before importing.
            - name: Clean up leftover signing keychain
              run: security delete-keychain signing_temp.keychain 2>/dev/null || true

            # Import Apple certificate
            - name: Import Code-Signing Certificates
              uses: Apple-Actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
                  p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm

            # Cache Homebrew packages to avoid reinstalling on every run.
            - name: Cache Homebrew packages
              uses: actions/cache@v4
              with:
                  path: ~/Library/Caches/Homebrew
                  key: homebrew-tesseract-${{ runner.os }}-x64

            # Install Tesseract and build the Python analyzer binary.
            - name: Install Tesseract
              # pkg-config lets tesserocr's source build find leptonica by its
              # real name (-lleptonica). Without it the link fails with
              # "library 'lept' not found" (legacy hardcoded fallback).
              run: brew install tesseract pkg-config

            - name: Build Python analyzer binary
              run: cd python && bash build.sh

            # Fail the build if the packaged binary doesn't actually use tesserocr
            # (a bundling gap can silently fall back to slow pytesseract). Runs the
            # unsigned binary locally; exits 0 only when in-process tesserocr inits.
            - name: Verify packaged binary uses tesserocr (in-process OCR)
              run: |
                  binaries/analyzer/darwin/darwin selftest || {
                    echo "::error::Packaged darwin binary is NOT using tesserocr — OCR would fall back to pytesseract"
                    exit 1
                  }

            # Sign all files in the onedir bundle before Electron Forge packages them.
            - name: Sign Python analyzer binary
              run: |
                  find binaries/analyzer/darwin -type f \( -name "*.dylib" -o -name "*.so" \) | while read f; do
                    codesign --force \
                      --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                      --options runtime \
                      --entitlements build/entitlements.plist \
                      --timestamp \
                      "$f"
                  done
                  codesign --force \
                    --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                    --options runtime \
                    --entitlements build/entitlements.plist \
                    --timestamp \
                    binaries/analyzer/darwin/_internal/tesseract/tesseract
                  codesign --force \
                    --sign "Developer ID Application: Antoine Duval (5DQ59NSHNB)" \
                    --options runtime \
                    --entitlements build/entitlements.plist \
                    --timestamp \
                    binaries/analyzer/darwin/darwin

            # Building Angular and making the Electron application.
            - name: Build Electron app
              run: npm run make

            # Rename the created binary.
            - name: Rename .dmg
              run: |
                  file=$(find out/make -type f -name "*.dmg" | head -n 1)
                  mv "$file" out/make/EBP-Tools-${GITHUB_REF_NAME}-x64.dmg

            # Generate update metadata files
            - name: Generate update metadata
              run: node scripts/generate-update-metadata.js ${GITHUB_REF_NAME} darwin x64

            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: macos-x64
                  path: |
                      out/make/*.dmg
                      out/make/*.zip
                      out/make/latest-mac.yml

    # Create the Windows version of the application.
    # Pinned to windows-2022 (Visual Studio 2022 / v17). windows-latest now maps
    # to the win25-vs2026 image (Visual Studio 2026 / v18), which the node-gyp
    # bundled with Electron does not recognize ("unsupported version: 18"),
    # breaking the native build of registry-js.
    build-windows:
        runs-on: windows-2022
        needs: [test]
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4
            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            # Pin Python so the prebuilt tesserocr wheel (cp312) installed by
            # build.bat matches the interpreter. tesserocr can't compile from
            # source on Windows; we use simonflueckiger's prebuilt wheel which
            # bundles tesseract+leptonica DLLs.
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm
            # Cache Tesseract installation to avoid reinstalling on every run.
            - name: Cache Tesseract
              uses: actions/cache@v4
              with:
                  path: C:\Program Files\Tesseract-OCR
                  key: choco-tesseract-${{ runner.os }}
            # Install Tesseract and build the Python analyzer binary.
            - name: Install Tesseract
              run: choco install tesseract --no-progress -y
            - name: Build Python analyzer binary
              run: cd python && .\build.bat
            # Fail the build if the packaged .exe doesn't actually use tesserocr
            # (a bundling gap can silently fall back to the slow pytesseract path,
            # like the cysignals issue caught on macOS). `selftest` exits 0 only
            # when the in-process tesserocr backend initialises in the frozen exe.
            - name: Verify packaged binary uses tesserocr (in-process OCR)
              shell: pwsh
              run: |
                  & "binaries\analyzer\win32.exe" selftest
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Packaged win32.exe is NOT using tesserocr (exit $LASTEXITCODE) — OCR would fall back to the slow pytesseract path."
                    exit 1
                  }
            # Building Angular and making the Electron application.
            - name: Build Electron app
              run: npm run make
            # Rename the created binary.
            - name: Rename .exe
              run: |
                  $file = Get-ChildItem -Path "out/make/squirrel.windows/x64/" -Filter *.exe | Select-Object -First 1
                  Rename-Item -Path $file.FullName -NewName "EBP-Tools-$env:GITHUB_REF_NAME.exe"
            # Generate update metadata files
            - name: Generate update metadata
              run: node scripts/generate-update-metadata.js $env:GITHUB_REF_NAME win32
            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: out/make/squirrel.windows/x64/*

    # Create the Linux version of the application.
    build-linux:
        runs-on: ubuntu-22.04
        needs: [test]
        steps:
            # Clone the repository.
            - uses: actions/checkout@v4
            # Install Node.js.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
            # Install NPM dependencies.
            - name: Install Node dependencies
              run: npm run install_npm
            # Install Python and build the analyzer binary.
            - name: Install Python
              uses: actions/setup-python@v5
              with:
                  # 3.12 comme sous Windows : numpy et scipy épinglés exigent
                  # >= 3.12, et aligner les interpréteurs supprime une variable.
                  python-version: '3.12'
            # tesseract-ocr-eng provides eng.traineddata, which build_linux_pyi.py
            # bundles next to evadigits.traineddata so the system tesseract finds both
            # via TESSDATA_PREFIX at runtime.
            - name: Install Tesseract eng data
              run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng
            - name: Build Python analyzer binary
              run: cd python && bash build_linux.sh
            # Building Angular and making the Electron application.
            - name: Build Electron app
              run: npm run make
            # Rename the created .deb.
            - name: Rename .deb
              run: |
                  file=$(find out/make -type f -name "*.deb" | head -n 1)
                  mv "$file" out/make/EBP-Tools-${GITHUB_REF_NAME}.deb
            # Upload the created binary.
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: linux
                  path: out/make/*.deb

    # Deploy the new version.
    deploy-builds:
        runs-on: ubuntu-latest
        needs: [build-windows, build-macos-arm64, build-macos-intel, build-linux]
        steps:
            # Retrieve the version number of the application.
            - name: Get version
              id: get_version
              run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            # Download the MacOS ARM64 binary created from the latest job.
            - name: Download macos-arm64 artifact
              uses: actions/download-artifact@v4
              with:
                  name: macos-arm64
                  path: ./release
            # Download the MacOS Intel (x64) binary created from the latest job.
            - name: Download macos-x64 artifact
              uses: actions/download-artifact@v4
              with:
                  name: macos-x64
                  path: ./release
            # Download the Windows binary created from the latest job.
            - name: Download Windows artifact
              uses: actions/download-artifact@v4
              with:
                  name: windows
                  path: ./release
            # Download the Linux binary created from the latest job.
            - name: Download Linux artifact
              uses: actions/download-artifact@v4
              with:
                  name: linux
                  path: ./release
            # Create a GitHub release.
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: Release ${{ steps.get_version.outputs.version }}
                  draft: false
                  prerelease: false
                  files: |
                      ./release/EBP-Tools-*.dmg
                      ./release/*.zip
                      ./release/EBP-Tools-*.exe
                      ./release/EBP-Tools-*.deb
                      ./release/RELEASES
                      ./release/*.nupkg
                      ./release/latest-mac.yml
                      ./release/latest.yml
