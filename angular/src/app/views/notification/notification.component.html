<main [class.left_rounded]="data.leftRounded">
  @if (images.length == 0) {
    <div class="loader">
      <ebp-loader
        [value]="data.percent"
        [infinite]="data.infinite"
        [icon]="data.icon"
        [state]="data.state"
      ></ebp-loader>
    </div>
    @if (data.text.startsWith('.')) {
      <ebp-message
        [state]="data.state"
        [html]="data.text.slice(1) | translate: data.textParams"
      >
      </ebp-message>
    } @else {
      <ebp-message [state]="data.state" [html]="data.text"> </ebp-message>
    }
  } @else {
    <div class="images">
      @if (data.text.startsWith('.')) {
        <ebp-message
          [state]="data.state"
          [html]="data.text.slice(1) | translate"
        >
        </ebp-message>
      } @else {
        <ebp-message [state]="data.state" [html]="data.text"> </ebp-message>
      }
      <div>
        @for (image of images; track image) {
          <img [src]="image" />
        }
      </div>
    </div>
  }
</main>
